name: Deploy news to pkrokosz.pl

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "articles/**"
      - ".htaccess"
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python .github/deploy_news.py
