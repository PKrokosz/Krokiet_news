name: Deploy to GitHub Pages
# WYŁĄCZONY — news jest wdrażany na pkrokosz.pl przez deploy-news.yml (FTP).
# Trigger poniżej nigdy się nie odpala (push wymaga nieistniejącej gałęzi `disabled`).
on:
  push:
    branches: [disabled]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r articles _site/
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
